[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chemo-regimen-dose-safety-agent"
version = "3.0.0"
description = "BSA-based dose calculation, order-variance checks, and user-defined cumulative exposure limits."
readme = "README.md"
authors = [{ name = "NAME" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
api = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]
dev = ["pytest>=8,<10"]

[project.scripts]
chemo-regimen-dose-safety-agent = "chemo_regimen_dose_safety_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/chemo-regimen-dose-safety-agent"
Repository = "https://github.com/abusuraihsakhri/chemo-regimen-dose-safety-agent.git"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
