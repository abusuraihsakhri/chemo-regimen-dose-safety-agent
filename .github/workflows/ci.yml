name: CI and Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,api]'
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q chemo_regimen_dose_safety_agent cli.py chemo_guard.py
      - name: Validate optional API
        run: |
          python - <<'PY'
          from chemo_regimen_dose_safety_agent.server import create_app
          app = create_app()
          paths = {route.path for route in app.routes}
          assert {"/health", "/api/audit"}.issubset(paths)
          PY
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run CLI batch smoke test
        run: chemo-regimen-dose-safety-agent batch -i sample.csv -o out_smoke.csv
      - name: Run browser calculation tests
        run: node --test tests/test_web.mjs

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
